{{ define "main" }}
  {{ partial "link-styles.html" . }}
    <div class="links-container">

    <header class="mb-12">

      {{ with .Content }}
        <div class="mt-4">
          {{ . }}
        </div>
      {{ end }}
    </header>

    {{ $paginator := .Paginate .Pages.ByDate.Reverse }}
    {{ range $paginator.Pages }}
      {{ partial "link-item.html" (dict "page" . "isSingle" false) }}
    {{ end }}

    {{ partial "pagination.html" . }}

  </div>
{{ end }}
